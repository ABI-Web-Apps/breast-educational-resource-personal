# Standalone stack: the site on http://localhost:3158 with its own backend.
#
#   docker compose up --build
#
# The portal does not use this file -- it builds the frontend as a UMD plugin
# and deploys resource-backend/docker-compose.yml onto its own network.
services:
  frontend:
    build:
      context: ./resource-frontend
      dockerfile: Dockerfile
    ports:
      - "${FRONTEND_PORT:-3158}:80"
    depends_on:
      - backend
    restart: "no"

  backend:
    build:
      context: ./resource-backend
      dockerfile: Dockerfile
    environment:
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-minioadmin}
      - DERIVED_CACHE_DIR=/resource_backend/cache
    volumes:
      - backend_cache:/resource_backend/cache
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"

  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - ./resource-backend/minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: "no"

  minio-init:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD};
      mc mb --ignore-existing myminio/measurements;
      echo 'MinIO bucket initialized';
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}

volumes:
  backend_cache:
