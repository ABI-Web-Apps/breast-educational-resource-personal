<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Breast Educational Resource</title>
    <meta name="description" content="Auckland Bioengineering Institute Breast Research App">
    <!-- iOS Safari reads this for the standalone status bar; Android reads the
         manifest's theme_color instead. Same value in both places. -->
    <meta name="theme-color" content="#ffffff">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
    <!-- Inter: a neutral humanist grotesk drawn for screens at small sizes,
         with tabular figures for the slice readout. 500 for the tab strip,
         600 for headings. -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,400;0,14..32,500;0,14..32,600;0,14..32,700;1,14..32,400&display=swap">
    <!-- `%BASE_URL%`, not a bare relative href: case pages are nested
         (/density-c/anatomy), and a relative href resolves against the
         document URL. -->
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon-180x180.png">
    <link rel="icon" href="%BASE_URL%favicon.ico">
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
