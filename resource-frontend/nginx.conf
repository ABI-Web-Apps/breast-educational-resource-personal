server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The imaging catalogue and health check, served by the FastAPI backend.
    location /api/ {
        proxy_pass http://backend:8082/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Volumes run to ~53MB; stream them rather than spooling to disk.
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # Hashed build assets: content-addressed, cache forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # PWA control files always revalidate, so a redeploy is picked up on the
    # next load instead of being pinned behind a stale service worker.
    location = /sw.js                { add_header Cache-Control "no-cache"; }
    location = /registerSW.js        { add_header Cache-Control "no-cache"; }
    location = /manifest.webmanifest { add_header Cache-Control "no-cache"; }

    # Single-page app: every route is index.html, and the app decides what
    # the path means (including its own 404 page).
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 256;
}
